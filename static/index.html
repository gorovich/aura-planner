<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura OS Royal Gold</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(212, 175, 55, 0.2);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f39c12, #d4af37, #f1c40f);
      --text-main: #ffffff;
      --text-muted: #8a8d93;
      --danger: #e74c3c;
      --success: #2ecc71;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* HEADER */
    .app-header {
      padding: 20px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 12, 16, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-placeholder {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--gold-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
    }

    .user-badge {
      font-size: 11px;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* TABS */
    .tab-content {
      display: none;
      padding: 0 16px;
      animation: fadeIn 0.25s ease-in-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* BALANCE CARD */
    .balance-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(212,175,55,0.05) 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      position: relative;
      overflow: hidden;
    }

    .balance-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .balance-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance-amount {
      font-size: 32px;
      font-weight: 800;
      margin: 8px 0 16px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 15px;
      font-weight: 600;
      margin-top: 2px;
    }

    .stat-val.inc { color: var(--success); }
    .stat-val.exp { color: var(--danger); }

    /* SEARCH & CONTROLS */
    .search-box {
      margin: 16px 0;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
    }

    /* LISTS & ITEMS */
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin: 16px 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .item-card:active {
      transform: scale(0.98);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .item-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .item-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-amount {
      font-size: 15px;
      font-weight: 600;
      text-align: right;
    }

    .item-amount.inc { color: var(--success); }
    .item-amount.exp { color: var(--text-main); }

    /* CHECKBOX FOR PLANNER */
    .task-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .task-checkbox.checked {
      background: var(--gold-primary);
    }

    .task-checkbox.checked::after {
      content: '✓';
      color: #000;
      font-size: 14px;
      font-weight: bold;
    }

    .task-title.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* FILTER PILLS */
    .pills-container {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pill.active {
      background: var(--gold-primary);
      color: #000;
      font-weight: 600;
      border-color: var(--gold-primary);
    }

    /* BOTTOM NAV BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      width: 33%;
    }

    .nav-btn icon {
      font-size: 20px;
    }

    .nav-btn.active {
      color: var(--gold-primary);
    }

    /* FAB BUTTON */
    .fab {
      position: fixed;
      bottom: 85px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--gold-gradient);
      color: #000;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      border: none;
      cursor: pointer;
      z-index: 90;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #15161c;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 360px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--gold-primary);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    .form-input, .form-select {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--gold-gradient);
      border: none;
      border-radius: 10px;
      padding: 12px;
      color: #000;
      font-weight: 600;
      font-size: 15px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="app-header">
    <div class="user-info">
      <div class="avatar-placeholder" id="userAvatar">A</div>
      <div>
        <div class="user-name" id="userName">Загрузка...</div>
        <div class="user-badge" id="userStatus">Royal Gold</div>
      </div>
    </div>
  </div>

  <!-- TAB 1: FINANCE -->
  <div id="tab-finance" class="tab-content active">
    <div class="balance-card">
      <div class="balance-title">Свободный баланс</div>
      <div class="balance-amount" id="balanceVal">0.00 AMD</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">Доходы</div>
          <div class="stat-val inc" id="incomeVal">+0.00</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Расходы</div>
          <div class="stat-val exp" id="expenseVal">-0.00</div>
        </div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchFinance" placeholder="🔍 Поиск по расходам и доходам..." oninput="renderFinanceList()">
    </div>

    <div class="section-title">
      <span>История операций</span>
      <span id="financeCount" style="font-size: 11px;">0 записей</span>
    </div>

    <div id="financeList"></div>
  </div>

  <!-- TAB 2: PLANNER -->
  <div id="tab-planner" class="tab-content">
    <div class="section-title" style="margin-top: 10px;">
      <span>Менеджер задач</span>
      <span id="taskCounter" style="font-size: 11px;">0 активных</span>
    </div>

    <div class="pills-container">
      <button class="pill active" onclick="setTaskFilter('all', this)">Все</button>
      <button class="pill" onclick="setTaskFilter('pending', this)">В процессе</button>
      <button class="pill" onclick="setTaskFilter('completed', this)">Выполнено</button>
    </div>

    <div id="plannerList"></div>
  </div>

  <!-- TAB 3: SETTINGS -->
  <div id="tab-settings" class="tab-content">
    <div class="section-title" style="margin-top: 10px;">Настройки профиля</div>
    
    <div class="balance-card" style="margin-bottom: 16px;">
      <div class="form-group">
        <label class="form-label">Основная валюта учета</label>
        <select class="form-select" id="currencySelect" onchange="saveUserSettings()">
          <option value="AMD">AMD (Армянский Драм)</option>
          <option value="USD">USD (Доллар США)</option>
          <option value="RUB">RUB (Российский Рубль)</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label">Язык интерфейса</label>
        <select class="form-select" id="languageSelect" onchange="saveUserSettings()">
          <option value="ru">Русский</option>
          <option value="hy">Հայերեն</option>
        </select>
      </div>
    </div>

    <div style="font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 20px;">
      Aura OS Royal Gold Edition • v2.5<br>
      Telegram WebApp Connected
    </div>
  </div>

  <!-- FAB (+) BUTTON -->
  <button class="fab" onclick="openModal()">+</button>

  <!-- MODAL FOR ADDING RECORD -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <div class="modal-title">Новая запись</div>
      
      <div class="form-group">
        <label class="form-label">Описание / Название</label>
        <input type="text" class="form-input" id="modalTitle" placeholder="Например: Бензин или Заехать на сервис">
      </div>

      <div class="form-group">
        <label class="form-label">Тип записи</label>
        <select class="form-select" id="modalType">
          <option value="task">📝 Задача (Планер)</option>
          <option value="expense">💸 Расход (Финансы)</option>
          <option value="income">📈 Доход (Финансы)</option>
        </select>
      </div>

      <button class="btn-submit" onclick="submitModalRecord()">Сохранить</button>
      <button class="btn-submit" style="background: transparent; color: var(--text-muted); margin-top: 4px;" onclick="closeModal()">Отмена</button>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('tab-finance', this)">
      <span style="font-size: 18px;">💰</span>
      <span>Финансы</span>
    </button>
    <button class="nav-btn" onclick="switchTab('tab-planner', this)">
      <span style="font-size: 18px;">📅</span>
      <span>Планер</span>
    </button>
    <button class="nav-btn" onclick="switchTab('tab-settings', this)">
      <span style="font-size: 18px;">⚙️</span>
      <span>Настройки</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const tgUser = tg?.initDataUnsafe?.user || { id: 1689610141, first_name: "Пользователь", username: "user" };
    
    let allRecords = [];
    let userSettings = { currency: 'AMD', language: 'ru' };
    let currentTaskFilter = 'all';

    // INITIALIZATION
    async function initApp() {
      document.getElementById('userName').innerText = tgUser.first_name || "Пользователь";
      document.getElementById('userAvatar').innerText = (tgUser.first_name || "A")[0].toUpperCase();

      await fetchUserInfo();
      await fetchRecords();
    }

    // API CALLS
    async function fetchUserInfo() {
      try {
        const res = await fetch(`/api/user/${tgUser.id}?first_name=${encodeURIComponent(tgUser.first_name)}&username=${encodeURIComponent(tgUser.username || '')}`);
        const data = await res.json();
        userSettings = data;
        document.getElementById('currencySelect').value = data.currency || 'AMD';
        document.getElementById('languageSelect').value = data.language || 'ru';
      } catch (e) {
        console.error("User info error:", e);
      }
    }

    async function fetchRecords() {
      try {
        const res = await fetch(`/api/records/${tgUser.id}`);
        allRecords = await res.json();
        renderFinanceList();
        renderPlannerList();
      } catch (e) {
        console.error("Fetch records error:", e);
      }
    }

    async function saveUserSettings() {
      haptic();
      const curr = document.getElementById('currencySelect').value;
      const lang = document.getElementById('languageSelect').value;
      
      await fetch('/api/user/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: tgUser.id, currency: curr, language: lang })
      });
      userSettings.currency = curr;
      renderFinanceList();
    }

    // RENDER FINANCE
    function renderFinanceList() {
      const listEl = document.getElementById('financeList');
      const query = document.getElementById('searchFinance').value.toLowerCase();
      listEl.innerHTML = '';

      let totalInc = 0;
      let totalExp = 0;
      let count = 0;

      const finRecords = allRecords.filter(r => r.category === 'finance');

      finRecords.forEach(r => {
        if (r.type === 'income') totalInc += r.amount;
        if (r.type === 'expense') totalExp += r.amount;

        if (query && !r.title.toLowerCase().includes(query)) return;

        count++;
        const isInc = r.type === 'income';
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-left">
            <div class="item-icon">${isInc ? '📈' : '💸'}</div>
            <div>
              <div class="item-title">${escapeHtml(r.title)}</div>
              <div class="item-sub">${isInc ? 'Зачисление' : 'Списание'}</div>
            </div>
          </div>
          <div class="item-amount ${isInc ? 'inc' : 'exp'}">
            ${isInc ? '+' : '-'}${r.amount.toFixed(2)} ${r.currency || userSettings.currency}
            <div style="font-size: 10px; color: var(--danger); cursor: pointer; margin-top: 4px;" onclick="deleteRecord(${r.id})">Удалить</div>
          </div>
        `;
        listEl.appendChild(card);
      });

      const netBalance = totalInc - totalExp;
      document.getElementById('balanceVal').innerText = `${netBalance.toFixed(2)} ${userSettings.currency}`;
      document.getElementById('incomeVal').innerText = `+${totalInc.toFixed(2)}`;
      document.getElementById('expenseVal').innerText = `-${totalExp.toFixed(2)}`;
      document.getElementById('financeCount').innerText = `${count} записей`;
    }

    // RENDER PLANNER
    function renderPlannerList() {
      const listEl = document.getElementById('plannerList');
      listEl.innerHTML = '';

      const tasks = allRecords.filter(r => r.category === 'task');
      let activeCnt = 0;

      tasks.forEach(r => {
        const isCompleted = r.status === 'completed';
        if (!isCompleted) activeCnt++;

        if (currentTaskFilter === 'pending' && isCompleted) return;
        if (currentTaskFilter === 'completed' && !isCompleted) return;

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-left">
            <div class="task-checkbox ${isCompleted ? 'checked' : ''}" onclick="toggleTaskStatus(${r.id}, '${r.status}')"></div>
            <div>
              <div class="item-title ${isCompleted ? 'completed' : ''}">${escapeHtml(r.title)}</div>
              <div class="item-sub">${isCompleted ? 'Выполнено' : 'В процессе'}</div>
            </div>
          </div>
          <div>
            <span style="font-size: 12px; color: var(--danger); cursor: pointer;" onclick="deleteRecord(${r.id})">🗑</span>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById('taskCounter').innerText = `${activeCnt} активных`;
    }

    // ACTIONS
    async function toggleTaskStatus(id, currentStatus) {
      haptic();
      const rec = allRecords.find(r => r.id === id);
      if (rec) {
        rec.status = currentStatus === 'completed' ? 'pending' : 'completed';
        renderPlannerList();
        
        // Переключение на бэке через ресоздание/триггер или быстрый запрос
        await fetch('/api/records', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: tgUser.id, title: rec.title })
        });
      }
    }

    async function deleteRecord(id) {
      haptic();
      await fetch(`/api/records/${id}`, { method: 'DELETE' });
      allRecords = allRecords.filter(r => r.id !== id);
      renderFinanceList();
      renderPlannerList();
    }

    async function submitModalRecord() {
      const title = document.getElementById('modalTitle').value.trim();
      if (!title) return;

      haptic();
      const res = await fetch('/api/records', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: tgUser.id, title: title })
      });
      const newRec = await res.json();
      allRecords.unshift(newRec);

      closeModal();
      document.getElementById('modalTitle').value = '';
      renderFinanceList();
      renderPlannerList();
    }

    // UI HELPERS
    function switchTab(tabId, btn) {
      haptic();
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function setTaskFilter(filter, btn) {
      haptic();
      currentTaskFilter = filter;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderPlannerList();
    }

    function openModal() { haptic(); document.getElementById('addModal').classList.add('active'); }
    function closeModal() { document.getElementById('addModal').classList.remove('active'); }
    function haptic() { if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    window.onload = initApp;
  </script>
</body>
</html>
