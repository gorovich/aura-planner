<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura OS Royal Gold</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #080806;
            --gold-primary: #d4af37;
            --gold-light: #fef08a;
            --gold-glow: rgba(212, 175, 55, 0.22);
            --card-glass: rgba(22, 19, 14, 0.85);
            --card-border: rgba(212, 175, 55, 0.18);
            
            --emerald-green: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.2);
            --ruby-rose: #f43f5e;
            
            --text-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #8e8770;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-black); color: var(--text-main); padding-bottom: 95px; min-height: 100vh; overflow-x: hidden; }
        .app-container { max-width: 480px; margin: 0 auto; padding: 16px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-badge { display: flex; align-items: center; gap: 12px; }
        .avatar { 
            width: 42px; height: 42px; border-radius: 14px; 
            background: linear-gradient(135deg, #f59e0b, #d4af37, #78350f); 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; font-size: 1.1rem; color: #000;
            box-shadow: 0 4px 18px var(--gold-glow); 
        }

        .view-section { display: none; animation: fadeIn 0.22s ease-in-out; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { 
            background: var(--card-glass); backdrop-filter: blur(20px); 
            border: 1px solid var(--card-border); border-radius: 22px; 
            padding: 18px; margin-bottom: 14px; box-shadow: 0 10px 35px rgba(0,0,0,0.6); 
        }
        .card-label { font-size: 0.72rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
        
        .balance-hero { 
            font-size: 2.2rem; font-weight: 900; letter-spacing: -0.5px; 
            background: linear-gradient(135deg, #fff 30%, #fef08a 70%, #d4af37 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            text-shadow: 0 0 30px var(--gold-glow);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .subtabs-container { display: flex; background: rgba(0,0,0,0.6); border: 1px solid var(--card-border); border-radius: 16px; padding: 4px; margin-bottom: 16px; }
        .subtab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-sub); font-weight: 700; font-size: 0.88rem; border-radius: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .subtab-btn.active.inc { background: linear-gradient(135deg, #059669, #10b981); color: white; box-shadow: 0 4px 15px var(--emerald-glow); }
        .subtab-btn.active.exp { background: linear-gradient(135deg, #e11d48, #f43f5e); color: white; box-shadow: 0 4px 15px rgba(244,63,94,0.3); }

        .item-card { background: var(--card-glass); border: 1px solid var(--card-border); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: transform 0.15s; }
        .item-card:active { transform: scale(0.98); }
        .item-left { display: flex; align-items: center; gap: 14px; }
        .item-icon { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .delete-btn { background: transparent; border: none; color: var(--text-sub); cursor: pointer; padding: 6px; transition: color 0.2s; }
        .delete-btn:hover { color: var(--ruby-rose); }

        .floating-bar { 
            position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); 
            width: calc(100% - 32px); max-width: 448px; 
            background: rgba(18, 15, 10, 0.92); backdrop-filter: blur(24px); 
            border: 1px solid var(--gold-primary); border-radius: 28px; 
            padding: 6px 12px; display: flex; align-items: center; gap: 8px; 
            box-shadow: 0 12px 40px var(--gold-glow); z-index: 100; 
        }
        .floating-bar input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 0.92rem; }
        .mic-btn { width: 38px; height: 38px; border-radius: 50%; background: rgba(212,175,55,0.08); border: 1px solid var(--card-border); color: var(--gold-light); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .mic-btn.recording { background: var(--ruby-rose); animation: pulse 1.2s infinite; border-color: var(--ruby-rose); color: white; }
        .send-btn { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #d4af37); border: none; color: #000; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px var(--gold-glow); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(8, 8, 6, 0.95); backdrop-filter: blur(24px); border-top: 1px solid var(--card-border); height: 68px; display: flex; justify-content: space-around; align-items: center; z-index: 99; }
        .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); font-size: 0.68rem; border: none; background: transparent; cursor: pointer; width: 25%; transition: color 0.2s; }
        .nav-tab i { font-size: 1.2rem; }
        .nav-tab.active { color: var(--gold-primary); font-weight: 700; text-shadow: 0 0 10px var(--gold-glow); }

        .select-field { background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); color: white; padding: 10px 14px; border-radius: 12px; width: 100%; margin-top: 8px; outline: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="user-badge">
                <div class="avatar" id="uAvatar">A</div>
                <div>
                    <h3 id="uName" style="font-size: 1rem; font-weight: 800; color: #fff;">Aura OS</h3>
                    <p style="font-size: 0.72rem; color: var(--gold-primary);" id="viewSubtitle">Royal Gold Edition</p>
                </div>
            </div>
            <i class="fa-solid fa-sliders" style="color: var(--gold-primary); font-size: 1.1rem; cursor: pointer;" onclick="switchTab('settings', document.querySelectorAll('.nav-tab')[3])"></i>
        </div>

        <!-- VIEW 1: DIGEST -->
        <div id="view-digest" class="view-section active">
            <div class="glass-card">
                <div class="card-label" id="lblNetBalance">Чистый Баланс</div>
                <div class="balance-hero" id="totalBalance">0.00 ֏</div>
            </div>
            <div class="grid-2">
                <div class="glass-card" onclick="switchTab('finance', document.querySelectorAll('.nav-tab')[2]); switchFinSubtab('income');">
                    <div class="card-label" style="color: var(--emerald-green);" id="lblIncome">Доходы</div>
                    <div style="font-size: 1.35rem; font-weight:800; color:var(--emerald-green);" id="cntIncome">0.00 ֏</div>
                </div>
                <div class="glass-card" onclick="switchTab('finance', document.querySelectorAll('.nav-tab')[2]); switchFinSubtab('expense');">
                    <div class="card-label" style="color: var(--ruby-rose);" id="lblExpense">Расходы</div>
                    <div style="font-size: 1.35rem; font-weight:800; color:var(--ruby-rose);" id="cntExpenses">0.00 ֏</div>
                </div>
            </div>
            <h4 style="margin: 16px 0 10px 0; font-size: 0.82rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px;" id="lblRecentActivity">Последняя активность</h4>
            <div id="digestList"></div>
        </div>

        <!-- VIEW 2: TASKS -->
        <div id="view-tasks" class="view-section">
            <h3 style="margin-bottom: 14px; font-weight: 800; color: var(--gold-light);" id="titleTasks">Задачи и дела</h3>
            <div id="tasksList"></div>
        </div>

        <!-- VIEW 3: FINANCE -->
        <div id="view-finance" class="view-section">
            <div class="subtabs-container">
                <button class="subtab-btn active exp" id="btnSubExp" onclick="switchFinSubtab('expense')">
                    <i class="fa-solid fa-arrow-up-long"></i> <span id="lblBtnExpense">Расходы</span>
                </button>
                <button class="subtab-btn" id="btnSubInc" onclick="switchFinSubtab('income')">
                    <i class="fa-solid fa-arrow-down-long"></i> <span id="lblBtnIncome">Доходы</span>
                </button>
            </div>
            <div id="financeItemsList"></div>
        </div>

        <!-- VIEW 4: SETTINGS -->
        <div id="view-settings" class="view-section">
            <h3 style="margin-bottom: 14px; font-weight: 800; color: var(--gold-light);" id="titleSettings">Настройки аккаунта</h3>
            
            <div class="glass-card">
                <div style="font-size:0.9rem; font-weight:700;" id="lblAppLang">Язык приложения</div>
                <div style="font-size:0.75rem; color:var(--text-sub); margin-top:2px;" id="lblAppLangSub">Выберите язык интерфейса</div>
                <select id="userLangSelect" class="select-field" onchange="updateLanguage(this.value)">
                    <option value="ru">Русский 🇷🇺</option>
                    <option value="hy">Հայերեն 🇦🇲</option>
                    <option value="en">English 🇬🇧</option>
                </select>
            </div>

            <div class="glass-card">
                <div style="font-size:0.9rem; font-weight:700;" id="lblBaseCurr">Валюта аккаунта</div>
                <div style="font-size:0.75rem; color:var(--text-sub); margin-top:2px;" id="lblBaseCurrSub">Автоматическая конвертация всех операций</div>
                <select id="userCurrSelect" class="select-field" onchange="updateCurrency(this.value)">
                    <option value="AMD">AMD (֏ - Армянский Драм)</option>
                    <option value="USD">USD ($ - Доллар США)</option>
                    <option value="RUB">RUB (₽ - Российский Рубль)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Floating Bar -->
    <div class="floating-bar">
        <input type="text" id="smartInput" placeholder="Напишите или надиктуйте..." onkeypress="if(event.key==='Enter') sendInput()">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()"><i class="fa-solid fa-microphone"></i></button>
        <button class="send-btn" onclick="sendInput()"><i class="fa-solid fa-arrow-up"></i></button>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-tab active" onclick="switchTab('digest', this)"><i class="fa-solid fa-chart-pie"></i><span id="navDigest">Обзор</span></button>
        <button class="nav-tab" onclick="switchTab('tasks', this)"><i class="fa-solid fa-list-check"></i><span id="navTasks">Задачи</span></button>
        <button class="nav-tab" onclick="switchTab('finance', this)"><i class="fa-solid fa-wallet"></i><span id="navFinance">Финансы</span></button>
        <button class="nav-tab" onclick="switchTab('settings', this)"><i class="fa-solid fa-gear"></i><span id="navSettings">Настройки</span></button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        let tgId = 12345678;

        if (tg?.initDataUnsafe?.user) {
            tgId = tg.initDataUnsafe.user.id;
            document.getElementById('uName').innerText = tg.initDataUnsafe.user.first_name || 'User';
            document.getElementById('uAvatar').innerText = (tg.initDataUnsafe.user.first_name || 'A')[0].toUpperCase();
        }

        const i18n = {
            ru: {
                netBalance: "Чистый Баланс",
                income: "Доходы",
                expense: "Расходы",
                recentActivity: "Последняя активность",
                titleTasks: "Задачи и дела",
                titleSettings: "Настройки аккаунта",
                appLang: "Язык приложения",
                appLangSub: "Выберите язык интерфейса",
                baseCurr: "Валюта аккаунта",
                baseCurrSub: "Автоматическая конвертация всех операций",
                inputPlaceholder: "Напишите или надиктуйте...",
                navDigest: "Обзор", navTasks: "Задачи", navFinance: "Финансы", navSettings: "Настройки",
                subDigest: "Royal Gold Edition", subTasks: "Ваши активные задачи",
                subFinance: "Управление доходами и расходами", subSettings: "Параметры и интеграции",
                tagTask: "ЗАДАЧА", tagIncome: "ДОХОД", tagExpense: "РАСХОД"
            },
            hy: {
                netBalance: "Մաքուր Մնացորդ",
                income: "Եկամուտներ",
                expense: "Ծախսեր",
                recentActivity: "Վերջին ակտիվությունը",
                titleTasks: "Առաջադրանքներ",
                titleSettings: "Հաշվի կարգավորումներ",
                appLang: "Հավելվածի լեզուն",
                appLangSub: "Ընտրեք ինտերֆեյսի լեզուն",
                baseCurr: "Հիմնական արժույթը",
                baseCurrSub: "Գործարքների ավտոմատ փոխարկում",
                inputPlaceholder: "Գրեք կամ ձայնագրեք...",
                navDigest: "Տեսք", navTasks: "Գործեր", navFinance: "Ֆինանսներ", navSettings: "Կարգավորումներ",
                subDigest: "Royal Gold Edition", subTasks: "Ձեր ակտիվ առաջադրանքները",
                subFinance: "Եկամուտների և ծախսերի կառավարում", subSettings: "Պարամետրեր և ինտեգրում",
                tagTask: "ԳՈՐԾ", tagIncome: "ԵԿԱՄՈՒՏ", tagExpense: "ԾԱԽՍ"
            },
            en: {
                netBalance: "Net Balance",
                income: "Income",
                expense: "Expenses",
                recentActivity: "Recent Activity",
                titleTasks: "Tasks & To-Dos",
                titleSettings: "Account Settings",
                appLang: "App Language",
                appLangSub: "Choose interface language",
                baseCurr: "Account Currency",
                baseCurrSub: "Auto-convert all transactions",
                inputPlaceholder: "Type or speak...",
                navDigest: "Overview", navTasks: "Tasks", navFinance: "Finance", navSettings: "Settings",
                subDigest: "Royal Gold Edition", subTasks: "Your active tasks",
                subFinance: "Income and expense management", subSettings: "Parameters and integrations",
                tagTask: "TASK", tagIncome: "INCOME", tagExpense: "EXPENSE"
            }
        };

        let records = [];
        let userCurrency = "AMD";
        let userLanguage = localStorage.getItem('aura_lang') || "ru";
        let activeFinSubtab = 'expense';
        let activeTab = 'digest';
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        async function loadUserInfo() {
            try {
                const res = await fetch(`/api/user/${tgId}`);
                if (res.ok) {
                    const data = await res.json();
                    userCurrency = data.currency || "AMD";
                    if (data.language) {
                        userLanguage = data.language;
                        localStorage.setItem('aura_lang', userLanguage);
                    }
                    document.getElementById('userCurrSelect').value = userCurrency;
                    document.getElementById('userLangSelect').value = userLanguage;
                }
            } catch(e) {}
            applyLanguage();
        }

        async function updateLanguage(lang) {
            userLanguage = lang;
            localStorage.setItem('aura_lang', lang);
            applyLanguage();
            try {
                await fetch('/api/user/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: tgId, language: lang })
                });
            } catch(e) {}
        }

        async function updateCurrency(curr) {
            userCurrency = curr;
            try {
                await fetch('/api/user/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: tgId, currency: curr })
                });
            } catch(e) {}
            loadData();
        }

        function applyLanguage() {
            const t = i18n[userLanguage] || i18n.ru;
            
            document.getElementById('lblNetBalance').innerText = t.netBalance;
            document.getElementById('lblIncome').innerText = t.income;
            document.getElementById('lblExpense').innerText = t.expense;
            document.getElementById('lblRecentActivity').innerText = t.recentActivity;
            document.getElementById('titleTasks').innerText = t.titleTasks;
            document.getElementById('titleSettings').innerText = t.titleSettings;
            document.getElementById('lblAppLang').innerText = t.appLang;
            document.getElementById('lblAppLangSub').innerText = t.appLangSub;
            document.getElementById('lblBaseCurr').innerText = t.baseCurr;
            document.getElementById('lblBaseCurrSub').innerText = t.baseCurrSub;
            document.getElementById('lblBtnExpense').innerText = t.expense;
            document.getElementById('lblBtnIncome').innerText = t.income;
            
            document.getElementById('smartInput').placeholder = t.inputPlaceholder;
            
            document.getElementById('navDigest').innerText = t.navDigest;
            document.getElementById('navTasks').innerText = t.navTasks;
            document.getElementById('navFinance').innerText = t.navFinance;
            document.getElementById('navSettings').innerText = t.navSettings;

            const subMap = { digest: t.subDigest, tasks: t.subTasks, finance: t.subFinance, settings: t.subSettings };
            document.getElementById('viewSubtitle').innerText = subMap[activeTab] || t.subDigest;

            render();
        }

        async function toggleMic() {
            const micBtn = document.getElementById('micBtn');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const formData = new FormData();
                        formData.append('file', audioBlob);
                        formData.append('telegram_id', tgId);

                        try {
                            await fetch('/api/voice', { method: 'POST', body: formData });
                            loadData();
                        } catch(e) {}
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                } catch (err) {
                    alert('Разрешите доступ к микрофону!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
            }
        }

        async function loadData() {
            try {
                const res = await fetch(`/api/records/${tgId}`);
                if (res.ok) records = await res.json();
            } catch(e) {}
            render();
        }

        async function sendInput() {
            const inp = document.getElementById('smartInput');
            const val = inp.value.trim();
            if (!val) return;

            try {
                await fetch('/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: tgId, title: val })
                });
            } catch(e) {}

            inp.value = '';
            loadData();
        }

        async function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            render();
            try { await fetch(`/api/records/${id}`, { method: 'DELETE' }); } catch(e) {}
        }

        function switchTab(viewName, btn) {
            activeTab = viewName;
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            if (btn) btn.classList.add('active');

            const t = i18n[userLanguage] || i18n.ru;
            const subMap = { digest: t.subDigest, tasks: t.subTasks, finance: t.subFinance, settings: t.subSettings };
            document.getElementById('viewSubtitle').innerText = subMap[viewName] || t.subDigest;
        }

        function switchFinSubtab(type) {
            activeFinSubtab = type;
            const btnExp = document.getElementById('btnSubExp');
            const btnInc = document.getElementById('btnSubInc');

            if (type === 'expense') {
                btnExp.className = 'subtab-btn active exp';
                btnInc.className = 'subtab-btn';
            } else {
                btnInc.className = 'subtab-btn active inc';
                btnExp.className = 'subtab-btn';
            }
            render();
        }

        function createCardElement(r) {
            const t = i18n[userLanguage] || i18n.ru;
            const isIncome = r.type === 'income';
            const formattedAmount = (r.amount || 0).toFixed(2);
            const currSymbol = r.currency || userCurrency;

            const card = document.createElement('div');
            card.className = 'item-card';

            let iconBg = 'rgba(212,175,55,0.12)';
            let iconColor = '#d4af37';
            let iconClass = 'fa-check';
            let tagText = t.tagTask;

            if (r.category === 'finance') {
                if (isIncome) {
                    iconBg = 'rgba(16,185,129,0.2)';
                    iconColor = '#10b981';
                    iconClass = 'fa-arrow-down-long';
                    tagText = t.tagIncome;
                } else {
                    iconBg = 'rgba(244,63,94,0.2)';
                    iconColor = '#f43f5e';
                    iconClass = 'fa-arrow-up-long';
                    tagText = t.tagExpense;
                }
            }

            card.innerHTML = `
                <div class="item-left">
                    <div class="item-icon" style="background:${iconBg}; color:${iconColor}; border:1px solid ${iconColor}44;">
                        <i class="fa-solid ${iconClass}"></i>
                    </div>
                    <div>
                        <div style="font-size:0.92rem; font-weight:700; color:#fff;">${r.title}</div>
                        <div style="font-size:0.75rem; color:var(--text-sub); margin-top:2px;">
                            ${tagText} ${r.amount ? '• <span style="color:'+iconColor+'; font-weight:bold;">' + (isIncome ? '+' : '-') + formattedAmount + ' ' + currSymbol + '</span>' : ''}
                        </div>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteRecord(${r.id})"><i class="fa-solid fa-trash"></i></button>
            `;
            return card;
        }

        function render() {
            const digestList = document.getElementById('digestList');
            const tasksList = document.getElementById('tasksList');
            const financeItemsList = document.getElementById('financeItemsList');

            digestList.innerHTML = ''; tasksList.innerHTML = ''; financeItemsList.innerHTML = '';

            let expTotal = 0;
            let incTotal = 0;

            records.forEach(r => {
                const isIncome = r.type === 'income';
                if (r.category === 'finance') {
                    if (isIncome) incTotal += (r.amount || 0);
                    else expTotal += (r.amount || 0);
                }

                digestList.appendChild(createCardElement(r));

                if (r.category === 'task') {
                    tasksList.appendChild(createCardElement(r));
                }

                if (r.category === 'finance') {
                    if (activeFinSubtab === 'income' && isIncome) {
                        financeItemsList.appendChild(createCardElement(r));
                    } else if (activeFinSubtab === 'expense' && !isIncome) {
                        financeItemsList.appendChild(createCardElement(r));
                    }
                }
            });

            const currSymbol = userCurrency === 'AMD' ? '֏' : (userCurrency === 'USD' ? '$' : '₽');
            document.getElementById('cntExpenses').innerText = expTotal.toFixed(2) + ' ' + currSymbol;
            document.getElementById('cntIncome').innerText = incTotal.toFixed(2) + ' ' + currSymbol;
            document.getElementById('totalBalance').innerText = (incTotal - expTotal).toFixed(2) + ' ' + currSymbol;
        }

        loadUserInfo().then(loadData);
    </script>
</body>
</html>
