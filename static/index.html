<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Planner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 30px; }
        .container { max-width: 480px; margin: 0 auto; padding: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info h1 { font-size: 1.1rem; }

        .ai-input-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .input-wrapper { display: flex; gap: 10px; align-items: center; }
        .ai-input { flex: 1; background: transparent; border: none; color: white; font-size: 0.95rem; outline: none; }
        .action-btn { width: 38px; height: 38px; border-radius: 12px; border: none; background: var(--accent-blue); color: white; cursor: pointer; }

        /* Tabs Navigation */
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 14px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-sub); font-weight: 600; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: var(--accent-blue); color: white; }

        /* Summary Cards */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; }
        .card-value { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }

        .item-list { display: flex; flex-direction: column; gap: 10px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .item-left { display: flex; align-items: center; gap: 10px; }
        .delete-btn { background: transparent; border: none; color: var(--text-sub); cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="user-info">
                <h1 id="userName">Aura AI Planner</h1>
            </div>
            <select id="langSelect" onchange="setLanguage(this.value)" style="background:#1e293b; color:white; border:none; padding:4px 8px; border-radius:8px;">
                <option value="ru">RU</option>
                <option value="en">EN</option>
                <option value="hy">HY</option>
            </select>
        </header>

        <div class="ai-input-card">
            <div class="input-wrapper">
                <input type="text" id="aiInput" class="ai-input" placeholder="Добавить запись..." onkeypress="if(event.key==='Enter') processInput()">
                <button class="action-btn" onclick="processInput()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div style="color:var(--text-sub); font-size:0.8rem;">💸 Расходы</div>
                <div class="card-value" id="valExpenses">$0</div>
            </div>
            <div class="card">
                <div style="color:var(--text-sub); font-size:0.8rem;">✅ Задачи</div>
                <div class="card-value" id="valTasks">0</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">Все</button>
            <button class="tab-btn" id="tabTasks" onclick="switchTab('task')">Задачи</button>
            <button class="tab-btn" id="tabFinance" onclick="switchTab('finance')">Финансы</button>
        </div>

        <div class="item-list" id="itemList"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        let userTgId = 12345678;
        if (tg?.initDataUnsafe?.user) {
            userTgId = tg.initDataUnsafe.user.id;
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
        }

        let records = [];
        let currentTab = 'all';

        async function loadRecords() {
            try {
                const res = await fetch(`/api/records/${userTgId}`);
                if (res.ok) records = await res.json();
            } catch (e) {}
            render();
        }

        async function processInput() {
            const input = document.getElementById('aiInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                await fetch('/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userTgId, title: text, category: 'task' })
                });
            } catch (e) {}

            input.value = '';
            loadRecords();
        }

        async function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            render();
            try { await fetch(`/api/records/${id}`, { method: 'DELETE' }); } catch (e) {}
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'all') document.getElementById('tabAll').classList.add('active');
            if (tab === 'task') document.getElementById('tabTasks').classList.add('active');
            if (tab === 'finance') document.getElementById('tabFinance').classList.add('active');
            render();
        }

        function render() {
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';

            let totalExp = 0;
            let totalTasks = 0;

            records.forEach(r => {
                if (r.category === 'finance') totalExp += (r.amount || 0);
                if (r.category === 'task') totalTasks++;
            });

            document.getElementById('valExpenses').innerText = '$' + totalExp;
            document.getElementById('valTasks').innerText = totalTasks;

            const filtered = records.filter(r => currentTab === 'all' || r.category === currentTab);

            filtered.forEach(r => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-left">
                        <i class="fa-solid ${r.category === 'finance' ? 'fa-dollar-sign' : 'fa-check'}" style="color:${r.category === 'finance' ? '#ef4444' : '#3b82f6'};"></i>
                        <div>
                            <div style="font-weight:600;">${r.title}</div>
                            <div style="font-size:0.75rem; color:var(--text-sub);">${r.category.toUpperCase()} ${r.amount ? '• $' + r.amount : ''}</div>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteRecord(${r.id})"><i class="fa-solid fa-trash"></i></button>
                `;
                listEl.appendChild(card);
            });
        }

        function setLanguage(lang) {}
        loadRecords();
    </script>
</body>
</html>
