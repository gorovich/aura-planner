<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura OS Royal Gold</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(212, 175, 55, 0.2);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f39c12, #d4af37, #f1c40f);
      --text-main: #ffffff;
      --text-muted: #8a8d93;
      --danger: #e74c3c;
      --success: #2ecc71;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }

    .app-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(11, 12, 16, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar-placeholder { width: 40px; height: 40px; border-radius: 50%; background: var(--gold-gradient); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
    .user-name { font-size: 16px; font-weight: 600; }
    .user-badge { font-size: 11px; color: var(--gold-primary); text-transform: uppercase; letter-spacing: 1px; }

    .tab-content { display: none; padding: 0 16px; animation: fadeIn 0.2s ease-in-out; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .balance-card { background: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(212,175,55,0.05) 100%); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 20px; margin-top: 10px; }
    .balance-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .balance-amount { font-size: 32px; font-weight: 800; margin: 8px 0 16px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-item { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; }
    .stat-label { font-size: 11px; color: var(--text-muted); }
    .stat-val { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .stat-val.inc { color: var(--success); }
    .stat-val.exp { color: var(--danger); }

    .search-box { margin: 14px 0; }
    .search-input { width: 100%; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: #fff; outline: none; }

    .section-title { font-size: 14px; font-weight: 600; color: var(--text-muted); margin: 16px 0 10px; display: flex; justify-content: space-between; }
    .item-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .item-icon { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; }

    .task-checkbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--gold-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .task-checkbox.checked { background: var(--gold-primary); }
    .task-checkbox.checked::after { content: '✓'; color: #000; font-weight: bold; }
    .task-title.completed { text-decoration: line-through; color: var(--text-muted); }

    .pills-container { display: flex; gap: 8px; margin-bottom: 12px; }
    .pill { padding: 6px 14px; border-radius: 20px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: var(--text-muted); cursor: pointer; }
    .pill.active { background: var(--gold-primary); color: #000; font-weight: 600; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: rgba(15, 16, 21, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; flex: 1; }
    .nav-btn.active { color: var(--gold-primary); }

    .fab { position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--gold-gradient); color: #000; font-size: 26px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; z-index: 90; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #15161c; border: 1px solid var(--card-border); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 360px; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 14px; color: var(--gold-primary); }
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block; }
    .form-input, .form-select { width: 100%; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: #fff; outline: none; }
    .btn-submit { width: 100%; background: var(--gold-gradient); border: none; border-radius: 10px; padding: 12px; color: #000; font-weight: 600; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="app-header">
    <div class="user-info">
      <div class="avatar-placeholder" id="userAvatar">A</div>
      <div>
        <div class="user-name" id="userName">Загрузка...</div>
        <div class="user-badge" id="userStatus">Royal Gold</div>
      </div>
    </div>
  </div>

  <!-- TAB 1: FINANCE -->
  <div id="tab-finance" class="tab-content active">
    <div class="balance-card">
      <div class="balance-title" data-i18n="balance">Свободный баланс</div>
      <div class="balance-amount" id="balanceVal">0.00 AMD</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label" data-i18n="income">Доходы</div>
          <div class="stat-val inc" id="incomeVal">+0.00</div>
        </div>
        <div class="stat-item">
          <div class="stat-label" data-i18n="expense">Расходы</div>
          <div class="stat-val exp" id="expenseVal">-0.00</div>
        </div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchFinance" placeholder="🔍 Поиск..." oninput="renderFinanceList()">
    </div>

    <div class="section-title">
      <span data-i18n="history">История операций</span>
      <span id="financeCount" style="font-size: 11px;">0</span>
    </div>

    <div id="financeList"></div>
  </div>

  <!-- TAB 2: PLANNER -->
  <div id="tab-planner" class="tab-content">
    <div class="section-title" style="margin-top: 10px;">
      <span data-i18n="planner">Менеджер задач</span>
      <span id="taskCounter" style="font-size: 11px;">0</span>
    </div>

    <div class="pills-container">
      <button class="pill active" onclick="setTaskFilter('all', this)" data-i18n="all">Все</button>
      <button class="pill" onclick="setTaskFilter('pending', this)" data-i18n="pending">В процессе</button>
      <button class="pill" onclick="setTaskFilter('completed', this)" data-i18n="completed">Выполнено</button>
    </div>

    <div id="plannerList"></div>
  </div>

  <!-- TAB 3: SETTINGS -->
  <div id="tab-settings" class="tab-content">
    <div class="section-title" style="margin-top: 10px;" data-i18n="settings">Настройки профиля</div>
    
    <div class="balance-card">
      <div class="form-group">
        <label class="form-label" data-i18n="currency">Основная валюта учета</label>
        <select class="form-select" id="currencySelect" onchange="saveUserSettings()">
          <option value="AMD">AMD (Դրամ)</option>
          <option value="USD">USD ($)</option>
          <option value="RUB">RUB (₽)</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <label class="form-label" data-i18n="language">Язык интерфейса</label>
        <select class="form-select" id="languageSelect" onchange="saveUserSettings()">
          <option value="ru">Русский</option>
          <option value="hy">Հայերեն</option>
        </select>
      </div>
    </div>
  </div>

  <!-- TAB 4: ADMIN -->
  <div id="tab-admin" class="tab-content">
    <div class="section-title" style="margin-top: 10px;">👑 Панель Администратора</div>
    
    <div class="balance-card" id="adminStatsBox">
      <div style="font-size: 13px; color: var(--text-muted);">Загрузка статистики...</div>
    </div>

    <div class="section-title">📢 Рассылка всем пользователям</div>
    <div class="balance-card">
      <div class="form-group">
        <textarea class="form-input" id="broadcastText" rows="3" placeholder="Текст рассылки..."></textarea>
      </div>
      <button class="btn-submit" onclick="sendBroadcast()">Отправить рассылку</button>
    </div>

    <div class="section-title">✉️ Личное сообщение</div>
    <div class="balance-card">
      <div class="form-group">
        <input type="text" class="form-input" id="directTarget" placeholder="Telegram ID или @username">
      </div>
      <div class="form-group">
        <textarea class="form-input" id="directMessageText" rows="3" placeholder="Текст личного сообщения..."></textarea>
      </div>
      <button class="btn-submit" onclick="sendDirectMessage()">Отправить сообщение</button>
    </div>

    <div class="section-title">👥 Список пользователей</div>
    <div id="adminUsersList"></div>
  </div>

  <!-- FAB (+) BUTTON -->
  <button class="fab" onclick="openModal()">+</button>

  <!-- MODAL -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <div class="modal-title" data-i18n="newRecord">Новая запись</div>
      
      <div class="form-group">
        <input type="text" class="form-input" id="modalTitle" placeholder="Заголовок или сумма...">
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="type">Тип записи</label>
        <select class="form-select" id="modalType">
          <option value="income" data-i18n="incType">📈 Доход (Финансы)</option>
          <option value="expense" data-i18n="expType">💸 Расход (Финансы)</option>
          <option value="task" data-i18n="task">📝 Задача (Планер)</option>
        </select>
      </div>

      <button class="btn-submit" onclick="submitModalRecord()" data-i18n="save">Сохранить</button>
      <button class="btn-submit" style="background: transparent; color: var(--text-muted);" onclick="closeModal()" data-i18n="cancel">Отмена</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('tab-finance', this)">
      <span style="font-size: 18px;">💰</span>
      <span data-i18n="finance">Финансы</span>
    </button>
    <button class="nav-btn" onclick="switchTab('tab-planner', this)">
      <span style="font-size: 18px;">📅</span>
      <span data-i18n="planner">Планер</span>
    </button>
    <button class="nav-btn" id="adminNavBtn" style="display: none;" onclick="switchTab('tab-admin', this)">
      <span style="font-size: 18px;">👑</span>
      <span data-i18n="admin">Админ</span>
    </button>
    <button class="nav-btn" onclick="switchTab('tab-settings', this)">
      <span style="font-size: 18px;">⚙️</span>
      <span data-i18n="settings">Настройки</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const tgUser = tg?.initDataUnsafe?.user || { id: 1689610141, first_name: "Пользователь", username: "user" };

    const i18n = {
      ru: {
        balance: "Свободный баланс", income: "Доходы", expense: "Расходы",
        history: "История операций", planner: "Менеджер задач",
        all: "Все", pending: "В процессе", completed: "Выполнено",
        settings: "Настройки профиля", currency: "Основная валюта учета",
        language: "Язык интерфейса", admin: "Админ", newRecord: "Новая запись",
        type: "Тип записи", task: "📝 Задача (Планер)", expType: "💸 Расход (Финансы)",
        incType: "📈 Доход (Финансы)", save: "Сохранить", cancel: "Отмена", finance: "Финансы"
      },
      hy: {
        balance: "Ազատ մնացորդ", income: "Եկամուտներ", expense: "Ծախսեր",
        history: "Գործարքների պատմություն", planner: "Առաջադրանքներ",
        all: "Բոլորը", pending: "Ընթացքի մեջ", completed: "Կատարված",
        settings: "Կարգավորումներ", currency: "Հիմնական արժույթ",
        language: "Ինտերֆեյսի լեզուն", admin: "Ադմին", newRecord: "Նոր գրանցում",
        type: "Տեսակը", task: "📝 Առաջադրանք", expType: "💸 Ծախս (Ֆինանսներ)",
        incType: "📈 Եկամուտ (Ֆինանսներ)", save: "Պահպանել", cancel: "Չեղարկել", finance: "Ֆինանսներ"
      }
    };

    let allRecords = [];
    let userSettings = { currency: 'AMD', language: 'ru', is_admin: false };
    let currentTaskFilter = 'all';

    async function initApp() {
      document.getElementById('userName').innerText = tgUser.first_name || "User";
      document.getElementById('userAvatar').innerText = (tgUser.first_name || "A")[0].toUpperCase();

      await fetchUserInfo();
      await fetchRecords();
    }

    function applyLanguage(lang) {
      const dict = i18n[lang] || i18n.ru;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.innerText = dict[key];
      });
    }

    async function fetchUserInfo() {
      try {
        const res = await fetch(`/api/user/${tgUser.id}?first_name=${encodeURIComponent(tgUser.first_name)}&username=${encodeURIComponent(tgUser.username || '')}`);
        const data = await res.json();
        userSettings = data;
        
        document.getElementById('currencySelect').value = data.currency || 'AMD';
        document.getElementById('languageSelect').value = data.language || 'ru';
        
        if (data.is_admin) {
          document.getElementById('adminNavBtn').style.display = 'flex';
        }

        applyLanguage(data.language || 'ru');
      } catch (e) {
        console.error("User info error:", e);
      }
    }

    async function fetchRecords() {
      try {
        const res = await fetch(`/api/records/${tgUser.id}`);
        allRecords = await res.json();
        renderFinanceList();
        renderPlannerList();
      } catch (e) {
        console.error("Fetch records error:", e);
      }
    }

    async function saveUserSettings() {
      haptic();
      const curr = document.getElementById('currencySelect').value;
      const lang = document.getElementById('languageSelect').value;
      
      await fetch('/api/user/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: tgUser.id, currency: curr, language: lang })
      });
      userSettings.currency = curr;
      userSettings.language = lang;

      applyLanguage(lang);
      renderFinanceList();
    }

    function renderFinanceList() {
      const listEl = document.getElementById('financeList');
      const query = document.getElementById('searchFinance').value.toLowerCase();
      listEl.innerHTML = '';

      let totalInc = 0;
      let totalExp = 0;
      let count = 0;

      const finRecords = allRecords.filter(r => r.category === 'finance');

      finRecords.forEach(r => {
        if (r.type === 'income') totalInc += r.amount;
        if (r.type === 'expense') totalExp += r.amount;

        if (query && !r.title.toLowerCase().includes(query)) return;

        count++;
        const isInc = r.type === 'income';
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-left">
            <div class="item-icon">${isInc ? '📈' : '💸'}</div>
            <div>
              <div class="item-title">${escapeHtml(r.title)}</div>
              <div class="item-sub">${isInc ? 'Зачисление' : 'Списание'}</div>
            </div>
          </div>
          <div style="text-align: right;">
            <div style="font-weight:600; color: ${isInc ? 'var(--success)' : '#fff'}">
              ${isInc ? '+' : '-'}${r.amount.toFixed(2)} ${r.currency || userSettings.currency}
            </div>
            <div style="font-size: 10px; color: var(--danger); cursor: pointer; margin-top: 2px;" onclick="deleteRecord(${r.id})">Удалить</div>
          </div>
        `;
        listEl.appendChild(card);
      });

      const netBalance = totalInc - totalExp;
      document.getElementById('balanceVal').innerText = `${netBalance.toFixed(2)} ${userSettings.currency}`;
      document.getElementById('incomeVal').innerText = `+${totalInc.toFixed(2)}`;
      document.getElementById('expenseVal').innerText = `-${totalExp.toFixed(2)}`;
      document.getElementById('financeCount').innerText = `${count}`;
    }

    function renderPlannerList() {
      const listEl = document.getElementById('plannerList');
      listEl.innerHTML = '';

      const tasks = allRecords.filter(r => r.category === 'task');
      let activeCnt = 0;

      tasks.forEach(r => {
        const isCompleted = r.status === 'completed';
        if (!isCompleted) activeCnt++;

        if (currentTaskFilter === 'pending' && isCompleted) return;
        if (currentTaskFilter === 'completed' && !isCompleted) return;

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-left">
            <div class="task-checkbox ${isCompleted ? 'checked' : ''}" onclick="toggleTaskStatus(${r.id}, '${r.status}')"></div>
            <div>
              <div class="item-title ${isCompleted ? 'completed' : ''}">${escapeHtml(r.title)}</div>
            </div>
          </div>
          <div>
            <span style="font-size: 12px; color: var(--danger); cursor: pointer;" onclick="deleteRecord(${r.id})">🗑</span>
          </div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById('taskCounter').innerText = `${activeCnt}`;
    }

    async function submitModalRecord() {
      const title = document.getElementById('modalTitle').value.trim();
      const selType = document.getElementById('modalType').value;
      if (!title) return;

      let cat = 'finance';
      let typ = 'expense';

      if (selType === 'income') { cat = 'finance'; typ = 'income'; }
      else if (selType === 'expense') { cat = 'finance'; typ = 'expense'; }
      else if (selType === 'task') { cat = 'task'; typ = 'expense'; }

      haptic();
      const res = await fetch('/api/records', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: tgUser.id,
          title: title,
          category: cat,
          type: typ
        })
      });

      const newRec = await res.json();
      allRecords.unshift(newRec);

      closeModal();
      document.getElementById('modalTitle').value = '';
      renderFinanceList();
      renderPlannerList();
    }

    async function fetchAdminStats() {
      try {
        const resStats = await fetch(`/api/admin/stats/${tgUser.id}`);
        const data = await resStats.json();
        document.getElementById('adminStatsBox').innerHTML = `
          <div style="font-size:13px; line-height: 1.8;">
            👥 Всего юзеров: <b>${data.total_users}</b><br>
            🤖 Активных в боте: <b>${data.active_bot_users}</b><br>
            💎 Премиум юзеров: <b>${data.premium_users}</b><br>
            🚫 Заблокировано: <b>${data.banned_users}</b><br>
            📝 Всего записей: <b>${data.total_records}</b>
          </div>
        `;

        const resUsers = await fetch(`/api/admin/users/${tgUser.id}`);
        const users = await resUsers.json();
        const usersListEl = document.getElementById('adminUsersList');
        usersListEl.innerHTML = '';

        users.forEach(u => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.style.flexDirection = 'column';
          card.style.alignItems = 'flex-start';
          card.style.gap = '8px';
          
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
              <div>
                <b>${escapeHtml(u.first_name)}</b> ${u.username ? '(@' + escapeHtml(u.username) + ')' : ''}
                <div style="font-size:11px; color:var(--text-muted);">ID: ${u.telegram_id} | Записей: ${u.records_count}</div>
              </div>
              <div style="font-size:12px;">
                ${u.is_premium ? '💎 Premium' : ''}
                ${u.is_blocked ? '🚫 Banned' : ''}
              </div>
            </div>
            <div style="display:flex; gap:8px; width:100%; margin-top:4px;">
              <button class="btn-submit" style="padding:6px; font-size:11px; margin:0; flex:1;" onclick="toggleUserPremium(${u.telegram_id})">
                ${u.is_premium ? 'Снять Premium' : 'Дать Premium'}
              </button>
              <button class="btn-submit" style="padding:6px; font-size:11px; margin:0; flex:1; background:var(--danger); color:#fff;" onclick="toggleUserBan(${u.telegram_id})">
                ${u.is_blocked ? 'Разбанить' : 'Забанить'}
              </button>
            </div>
          `;
          usersListEl.appendChild(card);
        });

      } catch (e) { console.error("Admin stats fetch error:", e); }
    }

    async function sendDirectMessage() {
      const target = document.getElementById('directTarget').value.trim();
      const text = document.getElementById('directMessageText').value.trim();
      if (!target || !text) {
        alert("Заполните ID/username и текст сообщения");
        return;
      }
      haptic();
      try {
        const res = await fetch('/api/admin/direct-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_id: tgUser.id, target: target, message_text: text })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`Сообщение отправлено для: ${data.recipient}`);
          document.getElementById('directTarget').value = '';
          document.getElementById('directMessageText').value = '';
        } else {
          alert(`Ошибка: ${data.detail}`);
        }
      } catch (e) {
        alert("Ошибка при отправке сообщения");
      }
    }

    async function toggleUserPremium(targetTgId) {
      haptic();
      await fetch('/api/admin/toggle-premium', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: tgUser.id, target_tg_id: targetTgId })
      });
      fetchAdminStats();
    }

    async function toggleUserBan(targetTgId) {
      haptic();
      await fetch('/api/admin/toggle-ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: tgUser.id, target_tg_id: targetTgId })
      });
      fetchAdminStats();
    }

    async function sendBroadcast() {
      const text = document.getElementById('broadcastText').value.trim();
      if (!text) return;
      haptic();
      const res = await fetch('/api/admin/broadcast', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admin_id: tgUser.id, message_text: text })
      });
      const data = await res.json();
      alert(`Успешно отправлено: ${data.success}`);
      document.getElementById('broadcastText').value = '';
    }

    async function toggleTaskStatus(id, currentStatus) {
      haptic();
      const rec = allRecords.find(r => r.id === id);
      if (rec) {
        rec.status = currentStatus === 'completed' ? 'pending' : 'completed';
        renderPlannerList();
      }
    }

    async function deleteRecord(id) {
      haptic();
      await fetch(`/api/records/${id}`, { method: 'DELETE' });
      allRecords = allRecords.filter(r => r.id !== id);
      renderFinanceList();
      renderPlannerList();
    }

    function switchTab(tabId, btn) {
      haptic();
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'tab-admin') fetchAdminStats();
    }

    function setTaskFilter(filter, btn) {
      haptic();
      currentTaskFilter = filter;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      renderPlannerList();
    }

    function openModal() { haptic(); document.getElementById('addModal').classList.add('active'); }
    function closeModal() { document.getElementById('addModal').classList.remove('active'); }
    function haptic() { if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    window.onload = initApp;
  </script>
</body>
</html>
