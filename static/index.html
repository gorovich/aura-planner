<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura SGX Planner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(22, 30, 46, 0.7);
            --accent-primary: #6366f1; /* SGX Indigo */
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --text-white: #f8fafc;
            --text-muted: #64748b;
            --border-glow: rgba(255, 255, 255, 0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-white); padding-bottom: 90px; }

        .app-container { max-width: 480px; margin: 0 auto; padding: 16px; }

        /* Top Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-badge { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        /* Views Screen Management */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* SGX Cards */
        .sgx-card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-glow); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
        .card-header { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; }
        .balance-val { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }

        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* List Items */
        .item-row { background: var(--card-bg); border: 1px solid var(--border-glow); border-radius: 16px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { display: flex; align-items: center; gap: 12px; }
        .item-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        /* Floating Input Bar (SGX Style) */
        .floating-input { position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 448px; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 25px; padding: 8px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; }
        .floating-input input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 0.95rem; }
        .send-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-primary); border: none; color: white; cursor: pointer; }

        /* Bottom Nav Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border-glow); height: 65px; display: flex; justify-content: space-around; align-items: center; z-index: 99; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 0.7rem; border: none; background: transparent; cursor: pointer; width: 20%; }
        .nav-item i { font-size: 1.2rem; }
        .nav-item.active { color: var(--accent-primary); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="user-badge">
                <div class="avatar" id="uAvatar">A</div>
                <div>
                    <h3 id="uName" style="font-size: 1rem;">Aura SGX</h3>
                    <p style="font-size: 0.75rem; color: var(--text-muted);">Personal Assistant</p>
                </div>
            </div>
            <i class="fa-solid fa-sliders" style="color: var(--text-muted);"></i>
        </div>

        <!-- VIEW 1: HOME -->
        <div id="view-home" class="view-section active">
            <div class="sgx-card">
                <div class="card-header">Общий баланс</div>
                <div class="balance-val" id="totalBalance">$0.00</div>
            </div>
            <div class="grid-2">
                <div class="sgx-card">
                    <div class="card-header">Задачи на сегодня</div>
                    <div style="font-size: 1.3rem; font-weight:700;" id="cntTasks">0</div>
                </div>
                <div class="sgx-card">
                    <div class="card-header">Расходы за день</div>
                    <div style="font-size: 1.3rem; font-weight:700; color:var(--accent-red);" id="cntExpenses">$0</div>
                </div>
            </div>
            <h4 style="margin: 15px 0 10px 0; font-size: 0.9rem; color: var(--text-muted);">Предстоящие дела</h4>
            <div id="homeList"></div>
        </div>

        <!-- VIEW 2: TASKS -->
        <div id="view-tasks" class="view-section">
            <h3 style="margin-bottom: 12px;">Список задач</h3>
            <div id="tasksList"></div>
        </div>

        <!-- VIEW 3: FINANCE -->
        <div id="view-finance" class="view-section">
            <h3 style="margin-bottom: 12px;">Финансы и Траты</h3>
            <div id="financeList"></div>
        </div>

        <!-- VIEW 4: ANALYTICS -->
        <div id="view-analytics" class="view-section">
            <h3 style="margin-bottom: 12px;">Аналитика</h3>
            <div class="sgx-card">
                <div style="height: 200px;">
                    <canvas id="sgxChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Smart Bar -->
    <div class="floating-input">
        <input type="text" id="smartInput" placeholder="Добавить задачу или расход..." onkeypress="if(event.key==='Enter') sendInput()">
        <button class="send-btn" onclick="sendInput()"><i class="fa-solid fa-arrow-up"></i></button>
    </div>

    <!-- SGX Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchView('home', this)"><i class="fa-solid fa-house"></i><span>Обзор</span></button>
        <button class="nav-item" onclick="switchView('tasks', this)"><i class="fa-solid fa-list-check"></i><span>Задачи</span></button>
        <button class="nav-item" onclick="switchView('finance', this)"><i class="fa-solid fa-wallet"></i><span>Финансы</span></button>
        <button class="nav-item" onclick="switchView('analytics', this)"><i class="fa-solid fa-chart-pie"></i><span>Отчеты</span></button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        let tgId = 12345678;
        if (tg?.initDataUnsafe?.user) {
            tgId = tg.initDataUnsafe.user.id;
            document.getElementById('uName').innerText = tg.initDataUnsafe.user.first_name;
            document.getElementById('uAvatar').innerText = tg.initDataUnsafe.user.first_name[0];
        }

        let records = [];

        async function loadData() {
            try {
                const res = await fetch(`/api/records/${tgId}`);
                if (res.ok) records = await res.json();
            } catch(e) {}
            render();
        }

        async function sendInput() {
            const inp = document.getElementById('smartInput');
            if (!inp.value.trim()) return;
            try {
                await fetch('/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: tgId, title: inp.value, category: 'task' })
                });
            } catch(e){}
            inp.value = '';
            loadData();
        }

        function switchView(viewName, btn) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            btn.classList.add('active');
        }

        function render() {
            const homeList = document.getElementById('homeList');
            const tasksList = document.getElementById('tasksList');
            const financeList = document.getElementById('financeList');

            homeList.innerHTML = ''; tasksList.innerHTML = ''; financeList.innerHTML = '';

            let expTotal = 0;
            let taskCnt = 0;

            records.forEach(r => {
                if (r.category === 'finance') expTotal += (r.amount || 0);
                if (r.category === 'task') taskCnt++;

                const html = `
                    <div class="item-row">
                        <div class="item-info">
                            <div class="item-icon" style="background:${r.category==='finance'?'rgba(244,63,94,0.1)':'rgba(99,102,241,0.1)'}; color:${r.category==='finance'?'#f43f5e':'#6366f1'};">
                                <i class="fa-solid ${r.category==='finance'?'fa-receipt':'fa-check'}"></i>
                            </div>
                            <div>
                                <div style="font-size:0.9rem; font-weight:600;">${r.title}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${r.category.toUpperCase()} ${r.amount ? '• $' + r.amount : ''}</div>
                            </div>
                        </div>
                    </div>
                `;

                homeList.innerHTML += html;
                if (r.category === 'task') tasksList.innerHTML += html;
                if (r.category === 'finance') financeList.innerHTML += html;
            });

            document.getElementById('cntExpenses').innerText = '$' + expTotal;
            document.getElementById('cntTasks').innerText = taskCnt;
            document.getElementById('totalBalance').innerText = '$' + (1000 - expTotal).toFixed(2);
        }

        loadData();
    </script>
</body>
</html>
